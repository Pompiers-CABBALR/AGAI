name: Intervention regression tests
on:
  pull_request:
    paths:
      - 'modules/07-appel-js.js'
      - 'modules/08-interventions-js.js'
      - 'modules/09-pilp-js.js'
      - 'modules/12-astreintes-js.js'
      - 'modules/15-storage-js.js'
      - 'modules/16-email-js.js'
      - 'modules/17-animal-js.js'
      - 'modules/26-piquet-weekly-js.js'
      - 'app.js'
      - 'index.html'
      - 'style.css'
      - 'version.json'
      - 'tests/test-route-confirmation-persistence.cjs'
      - 'tests/test-version-consistency.cjs'
      - 'tests/test-boot-health.cjs'
      - 'tests/test-browser-boot.cjs'
      - 'tests/test-piquet-recovery-and-validation.cjs'
      - 'tests/test-piquet-weekly-draft.cjs'
      - 'tests/test-superadmin-piquet-power.cjs'
      - '.github/workflows/intervention-regressions.yml'
  push:
    branches: [main]
    paths:
      - 'modules/07-appel-js.js'
      - 'modules/08-interventions-js.js'
      - 'modules/09-pilp-js.js'
      - 'modules/12-astreintes-js.js'
      - 'modules/16-email-js.js'
      - 'modules/17-animal-js.js'
      - 'modules/26-piquet-weekly-js.js'
      - 'app.js'
      - 'index.html'
      - 'style.css'
      - 'version.json'
      - 'tests/test-route-confirmation-persistence.cjs'
      - 'tests/test-boot-health.cjs'
      - 'tests/test-browser-boot.cjs'
      - 'tests/test-piquet-recovery-and-validation.cjs'
      - 'tests/test-piquet-weekly-draft.cjs'
      - 'tests/test-superadmin-piquet-power.cjs'
      - '.github/workflows/intervention-regressions.yml'
permissions:
  contents: read
jobs:
  interventions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check published JavaScript syntax
        run: |
          node --check modules/07-appel-js.js
          node --check modules/08-interventions-js.js
          node --check modules/09-pilp-js.js
          node --check modules/12-astreintes-js.js
          node --check modules/16-email-js.js
          node --check modules/17-animal-js.js
          node --check modules/26-piquet-weekly-js.js
          node --check app.js
      - name: Test modules and release versions
        run: node --test tests/test-route-confirmation-persistence.cjs tests/test-version-consistency.cjs tests/test-boot-health.cjs tests/test-piquet-recovery-and-validation.cjs tests/test-piquet-weekly-draft.cjs tests/test-superadmin-piquet-power.cjs
      - name: Smoke test Astreintes, A/SA and call intake in Chrome
        run: node --test tests/test-browser-boot.cjs
      - name: Test published bundle
        run: node --test tests/test-route-confirmation-persistence.cjs
        env:
          AGAI_TEST_BUNDLE: '1'
